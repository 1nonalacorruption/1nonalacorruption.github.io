name: Veille corruption quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Africa/Abidjan'

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rechercher et classer les actualités
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import html
          import os
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Africa/Abidjan")
          now = datetime.now(TZ)
          date = now.strftime("%Y-%m-%d")

          os.makedirs(f"actualite/{date}", exist_ok=True)

          queries = [
              "corruption Côte d'Ivoire",
              "corruption Côte d'Ivoire enquête",
              "corruption Côte d'Ivoire condamnation",
              "corruption Afrique",
              "corruption bribery investigation Africa",
              "corruption public officials Africa",
              "corruption enquête Afrique"
          ]

          articles = []
          seen = set()

          for query in queries:

              url = (
                  "https://news.google.com/rss/search?"
                  + urllib.parse.urlencode({
                      "q": query,
                      "hl": "fr",
                      "gl": "CI",
                      "ceid": "CI:fr"
                  })
              )

              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      data = response.read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item"):

                      title = item.findtext("title") or ""
                      link = item.findtext("link") or ""
                      pubdate = item.findtext("pubDate") or ""
                      source = item.findtext("source") or ""

                      title = html.unescape(title).strip()
                      link = link.strip()
                      source = html.unescape(source).strip()

                      key = title.lower()

                      if not title or not link or key in seen:
                          continue

                      seen.add(key)

                      articles.append({
                          "title": title,
                          "link": link,
                          "date": pubdate,
                          "source": source
                      })

              except Exception as error:

                  print(
                      f"Flux inaccessible pour {query}: {error}"
                  )

          articles = articles[:20]

          def classify(title):

              text = title.lower()

              official_words = [
                  "condamné",
                  "condamnee",
                  "condamnation",
                  "jugé coupable",
                  "jugée coupable",
                  "reconnu coupable",
                  "reconnue coupable",
                  "sentence",
                  "sentenced",
                  "convicted",
                  "guilty",
                  "verdict",
                  "arrêt de la cour",
                  "décision judiciaire"
              ]

              investigation_words = [
                  "enquête",
                  "enquetes",
                  "enquête ouverte",
                  "investigation",
                  "investigations",
                  "accusé",
                  "accusée",
                  "accusation",
                  "soupçon",
                  "soupçonné",
                  "soupçonnée",
                  "suspecté",
                  "suspectée",
                  "alleged",
                  "allegation",
                  "probe",
                  "under investigation"
              ]

              context_words = [
                  "rapport",
                  "rapport annuel",
                  "indice",
                  "transparence",
                  "prévention",
                  "lutte contre la corruption",
                  "anti-corruption",
                  "anticorruption",
                  "gouvernance"
              ]

              if any(word in text for word in official_words):
                  return (
                      "🟡 Décision officielle à vérifier",
                      "decision"
                  )

              if any(word in text for word in investigation_words):
                  return (
                      "🟠 Enquête / allégation",
                      "investigation"
                  )

              if any(word in text for word in context_words):
                  return (
                      "🔵 Information / contexte",
                      "context"
                  )

              return (
                  "⚪ À vérifier",
                  "verify"
              )

          def escape(value):
              return html.escape(
                  value,
                  quote=True
              )

          cards = ""

          if articles:

              for article in articles:

                  status, status_type = classify(
                      article["title"]
                  )

                  cards += f"""
                  <article class="article">

                    <div class="status {status_type}">
                      {escape(status)}
                    </div>

                    <h2>
                      {escape(article["title"])}
                    </h2>

                    <p class="meta">
                      <strong>Source :</strong>
                      {escape(article["source"])
                      if article["source"]
                      else "Source indiquée dans le flux"}
                    </p>

                    <p class="meta">
                      <strong>Date :</strong>
                      {escape(article["date"])}
                    </p>

                    <p>
                      Cette information a été détectée
                      automatiquement dans un flux d'actualité.
                      Son statut doit être vérifié à partir
                      de la source originale.
                    </p>

                    <a
                      href="{escape(article["link"])}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Consulter la source originale →
                    </a>

                  </article>
                  """

          else:

              cards = """
              <p>
                Aucune actualité n'a été récupérée
                lors de cette veille.
              </p>
              """

          page = f"""<!DOCTYPE html>

          <html lang="fr">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>
              Actualité corruption - {date}
            </title>

            <style>

              body {{
                font-family:
                  Arial,
                  Helvetica,
                  sans-serif;

                max-width: 950px;

                margin: auto;

                padding: 20px;

                line-height: 1.6;

                background: #f5f5f5;

                color: #222;
              }}

              h1 {{
                margin-bottom: 5px;
              }}

              .intro {{
                background: white;

                padding: 20px;

                border-radius: 10px;

                margin-bottom: 25px;
              }}

              .warning {{
                background: #fff3cd;

                padding: 15px;

                border-radius: 8px;

                border-left: 5px solid #f0ad4e;
              }}

              .article {{
                background: white;

                padding: 20px;

                margin-bottom: 20px;

                border-radius: 10px;

                box-shadow:
                  0 1px 6px
                  rgba(0,0,0,.08);
              }}

              .article h2 {{
                margin-top: 12px;

                font-size: 21px;
              }}

              .meta {{
                color: #666;

                font-size: 14px;
              }}

              .status {{
                display: inline-block;

                padding: 6px 10px;

                border-radius: 6px;

                font-weight: bold;

                font-size: 14px;
              }}

              .decision {{
                background: #fff3cd;
              }}

              .investigation {{
                background: #ffe0b2;
              }}

              .context {{
                background: #d9edf7;
              }}

              .verify {{
                background: #eeeeee;
              }}

              a {{
                font-weight: bold;

                text-decoration: none;
              }}

              .footer {{
                margin-top: 30px;

                padding-top: 20px;

                border-top: 1px solid #ddd;

                color: #666;
              }}

            </style>

          </head>

          <body>

            <h1>
              Actualité de la corruption
            </h1>

            <p>
              <strong>
                Édition du {date}
              </strong>
            </p>

            <section class="intro">

              <h2>
                Veille quotidienne
              </h2>

              <p>
                Cette page rassemble des informations
                récentes relatives à la corruption,
                aux enquêtes, aux accusations,
                aux décisions judiciaires et à la
                gouvernance.
              </p>

              <div class="warning">

                <strong>
                  Important :
                </strong>

                la classification affichée est
                automatique et préliminaire.

                Une accusation, un soupçon ou une
                enquête ne constitue pas en soi une
                preuve de culpabilité.

                Les décisions officielles doivent
                être vérifiées auprès des sources
                compétentes.

              </div>

            </section>

            {cards}

            <div class="footer">

              <p>
                <a href="../">
                  ← Retour aux actualités
                </a>
              </p>

              <p>
                Non à la corruption —
                Comprendre, reconnaître et refuser
                la corruption.
              </p>

            </div>

          </body>

          </html>
          """

          with open(
              f"actualite/{date}/index.html",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(page)

          os.makedirs(
              "actualite",
              exist_ok=True
          )

          folders = sorted(
              [
                  name
                  for name in os.listdir("actualite")
                  if re.fullmatch(
                      r"\d{4}-\d{2}-\d{2}",
                      name
                  )
              ],
              reverse=True
          )

          links = "\n".join(
              f"""
              <li>
                <a href="{folder}/">
                  Édition du {folder}
                </a>
              </li>
              """
              for folder in folders
          )

          archive = f"""<!DOCTYPE html>

          <html lang="fr">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>
              Actualité - Non à la corruption
            </title>

          </head>

          <body>

            <h1>
              Actualité corruption
            </h1>

            <p>
              Retrouvez ici les différentes
              éditions quotidiennes de notre veille.
            </p>

            <ul>
              {links}
            </ul>

            <p>
              <a href="../">
                ← Retour à l'accueil
              </a>
            </p>

          </body>

          </html>
          """

          with open(
              "actualite/index.html",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(archive)

          print(
              f"Veille terminée : "
              f"{len(articles)} information(s) récupérée(s)."
          )

          PY

      - name: Publier les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add actualite/

          if git diff --cached --quiet; then
            echo "Aucune nouvelle publication."
          else
            git commit -m "Amélioration de la veille corruption $(date -u '+%Y-%m-%d')"
            git push
          fi
